<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #000000;
        font-family: 'Arial', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #ffffff;
        position: relative;
        overflow: hidden;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
            radial-gradient(circle at 20% 50%, rgba(123, 44, 191, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 80% 50%, rgba(199, 125, 255, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 50% 50%, rgba(255, 0, 0, 0.1) 0%, transparent 50%),
            linear-gradient(135deg, rgba(123, 44, 191, 0.1) 0%, transparent 50%);
        pointer-events: none;
        z-index: 1;
    }

    svg#bg-pattern {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    div:first-child {
        font-size: 2.5em;
        margin-bottom: 30px;
        text-shadow: 0 0 10px rgba(255, 0, 0, 0.5), 0 0 20px rgba(123, 44, 191, 0.3);
        font-weight: bold;
        letter-spacing: 2px;
        position: relative;
        z-index: 10;
    }

    button {
        background-color: #7b2cbf;
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 1.1em;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        margin-bottom: 30px;
        transition: all 0.3s ease;
        text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        position: relative;
        z-index: 10;
    }

    button:hover {
        background-color: #9d4edd;
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(157, 78, 221, 0.8);
    }

    button:active {
        transform: scale(0.98);
    }

    button.hidden {
        display: none;
    }

    #camera-section {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        position: relative;
        z-index: 16;
    }

    #camera-section.visible {
        display: flex;
    }

    #gauge-container {
        width: 300px;
        height: 80px;
        background-color: rgba(20, 20, 20, 0.8);
        border: 2px solid #7b2cbf;
        border-radius: 10px;
        padding: 15px;
        position: relative;
        overflow: hidden;
        display: none;
    }

    #gauge-container.visible {
        display: block;
    }

    #gauge-class-name {
        font-size: 1.2em;
        color: #ffff00;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
        margin-bottom: 10px;
        text-align: center;
    }

    #gauge-bar-container {
        width: 100%;
        height: 20px;
        background-color: rgba(123, 44, 191, 0.3);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
    }

    #gauge-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #7b2cbf, #c77dff);
        border-radius: 10px;
        transition: width 0.1s linear;
        box-shadow: 0 0 20px rgba(199, 125, 255, 0.8);
    }

    #domain-expansion {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: radial-gradient(circle, rgba(255, 0, 0, 0.4), transparent);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 9;
    }

    #domain-expansion.active {
        animation: expandDomain 0.8s ease-out;
    }

    @keyframes expandDomain {
        0% {
            width: 0;
            height: 0;
            opacity: 1;
        }
        100% {
            width: 150vw;
            height: 150vh;
            opacity: 0;
        }
    }

    #webcam-container {
        display: flex;
        justify-content: center;
        position: relative;
        z-index: 10;
    }

    #webcam-container canvas {
        border: 3px solid #7b2cbf;
        border-radius: 50%;
        box-shadow: 0 0 30px rgba(123, 44, 191, 0.6), 0 0 50px rgba(157, 78, 221, 0.3);
        max-width: 100%;
        height: auto;
    }

    #label-container {
        background-color: rgba(20, 20, 20, 0.8);
        padding: 12px 20px;
        border-radius: 10px;
        border: 2px solid #7b2cbf;
        position: fixed;
        right: 40px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        min-width: 280px;
        display: none;
    }

    #label-container.visible {
        display: block;
    }

    #label-container div {
        font-size: 1.3em;
        padding: 6px 0;
        color: #ffff00;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
        border-bottom: 1px solid rgba(123, 44, 191, 0.3);
    }

    #label-container div:last-child {
        border-bottom: none;
    }

    #label-container div.selected-class {
        background: rgba(255, 0, 0, 0.15);
        border-bottom: 1px solid #ff0000;
        box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.3);
        color: #ffffff;
    }

    /* 좌측 이미지 3종 (상단/중단/하단) */
    .left-image {
        position: fixed;
        left: 40px;
        width: 220px;
        border: 2px solid #7b2cbf;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(123, 44, 191, 0.5);
        overflow: hidden;
        z-index: 10;
        background-color: rgba(20, 20, 20, 0.8);
        display: none;
        transition: opacity 0.4s ease, box-shadow 0.3s ease, transform 0.2s ease;
        cursor: pointer;
    }

    .left-image:hover {
        box-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
        transform: scale(1.03);
    }

    .left-image:active {
        transform: scale(0.97);
    }

    .left-image.visible {
        display: block;
    }

    /* 무량공처 전용 배경 효과 (에너지 파편 캔버스) */
    #domainCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.2s ease;
    }

    #domainCanvas.active {
        opacity: 1;
    }

    /* 무량공처 3단계 - 우주적 붓터치(블랙홀) 캔버스 */
    #cosmicCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.2s ease;
    }

    #cosmicCanvas.active {
        opacity: 1;
    }

    /* 무량공처 1단계 - 화이트아웃 플래시 (모든 것을 덮음) */
    #whiteFlash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        z-index: 20;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease-in-out; /* 사라질 때: 천천히 부드럽게 페이드아웃 */
    }

    #whiteFlash.active {
        opacity: 1;
        transition: opacity 0.5s ease-in-out; /* 나타날 때: 천천히 부드럽게 페이드인 */
    }

    /* 영역전개 충전(주력을 모으는) 단계 전용 캔버스 */
    #chargeCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    #chargeCanvas.active {
        opacity: 1;
    }

    /* ==========================================================
        복마어주자 전용 화면 전환 (붉은 주력 폭발 -> 청록 격자벽/피바다 영역)
    ========================================================== */
    #bokmaContainer {
        position: fixed;
        inset: 0;
        z-index: 15;
        overflow: hidden;
        pointer-events: none;
        opacity: 0;
        background-color: #041a1e;
        box-sizing: border-box;
        transition: opacity 0.9s ease-in-out; /* 나타날 때: 부드럽게 */
    }

    #bokmaContainer.bokma-visible {
        opacity: 1;
        transition: opacity 0.9s ease-in-out;
    }

    #bokmaContainer.bokma-closing {
        opacity: 0;
        transition: opacity 0.2s ease-in; /* 사라질 때: 빠르고 확실하게 (잔상 겹침 방지) */
    }

    .bokma-cursed-energy-wave {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        background: radial-gradient(circle, rgba(255,0,0,1) 0%, rgba(150,0,0,0.8) 40%, rgba(0,0,0,0) 70%);
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
        pointer-events: none;
        z-index: 10;
    }

    .bokma-expand-energy {
        animation: bokmaExplode 1.8s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
    }

    @keyframes bokmaExplode {
        0% {
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            filter: blur(10px);
        }
        30% {
            opacity: 1;
            filter: blur(30px);
        }
        70% {
            opacity: 0.9;
            filter: blur(50px);
        }
        100% {
            transform: translate(-50%, -50%) scale(300);
            opacity: 0;
            filter: blur(100px);
        }
    }

    .bokma-shake {
        animation: bokmaScreenShake 0.8s ease-in-out;
    }

    @keyframes bokmaScreenShake {
        0%, 100% { transform: translate(0, 0); }
        10%, 30%, 50%, 70%, 90% { transform: translate(-8px, 4px) rotate(-1deg); }
        20%, 40%, 60%, 80% { transform: translate(8px, -4px) rotate(1deg); }
    }

    .bokma-domain-world {
        position: absolute;
        inset: 0;
        opacity: 0;
        box-sizing: border-box;
        background-color: #041a1e; /* 이미지가 letterbox로 남기는 여백도 검정이 아닌 어두운 청록으로 */
        transition: opacity 1.2s ease-in-out;
        z-index: 5;
    }

    .bokma-domain-world.active {
        opacity: 1;
    }

    /* 이미지 자체가 배경(전체 장면: 벽/피바다/문)을 이미 담고 있으므로
       별도의 청록벽/피바다 레이어 없이 <img> 태그로 화면 전체에 꽉 채워서 표시합니다 */
    .bokma-shrine-wrapper {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .bokma-shrine-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transform: scale(0.95);
        transition: opacity 1.2s ease-out, transform 1.2s ease-out;
        filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.35));
    }

    .bokma-domain-world.active .bokma-shrine-img {
        opacity: 1;
        transform: scale(1);
    }

    .bokma-domain-text {
        position: absolute;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        color: #ff3333;
        font-size: 2.5rem;
        font-weight: 900;
        letter-spacing: 15px;
        text-shadow: 0 0 20px #ff0000, 0 0 40px #550000;
        opacity: 0;
        z-index: 15;
        transition: opacity 1.5s ease-in-out;
        pointer-events: none;
    }

    .bokma-domain-text.show {
        opacity: 1;
    }

    /* ==========================================================
        감함압예정 전용 화면 전환 (검은 주력 오버레이 -> 그림자 늪 -> 그림자 분신들)
    ========================================================== */
    #gamContainer {
        position: fixed;
        inset: 0;
        z-index: 15;
        overflow: hidden;
        pointer-events: none;
        opacity: 0;
        background-color: #0d0d11;
        box-sizing: border-box;
        transition: opacity 0.9s ease-in-out;
    }

    #gamContainer.gam-visible {
        opacity: 1;
        transition: opacity 0.9s ease-in-out;
    }

    #gamContainer.gam-closing {
        opacity: 0;
        transition: opacity 0.2s ease-in;
    }

    .gam-shadow-garden-wrapper {
        position: absolute;
        inset: 0;
        filter: url('#gooey-shadow-gam');
        opacity: 0;
        transition: opacity 2s ease-in-out;
        z-index: 5;
    }

    .gam-shadow-garden-wrapper.active {
        opacity: 1;
    }

    .gam-shadow-floor {
        position: absolute;
        bottom: -100px;
        left: -10%;
        width: 120%;
        height: 0%;
        background: linear-gradient(to top, #000000 0%, #2d0140 55%, #6b21a8 100%);
        box-shadow: 0 -25px 60px rgba(147, 51, 234, 0.45);
        border-radius: 50% 50% 0 0;
        transition: height 3s cubic-bezier(0.1, 0.8, 0.3, 1);
    }

    .gam-shadow-garden-wrapper.active .gam-shadow-floor {
        height: 40%;
    }

    .gam-shadow-clone {
        position: absolute;
        bottom: 10%;
        width: 80px;
        height: 150px;
        background: radial-gradient(circle at 35% 28%,
            rgba(255, 255, 255, 0.95) 0%,
            rgba(216, 170, 255, 0.85) 22%,
            rgba(147, 51, 234, 0.9) 55%,
            rgba(58, 0, 92, 0.95) 85%,
            rgba(30, 0, 48, 0.98) 100%);
        box-shadow: 0 0 25px rgba(216, 170, 255, 0.7), 0 0 55px rgba(147, 51, 234, 0.5);
        border-radius: 40% 40% 30% 30% / 60% 60% 40% 40%;
        opacity: 0;
        transform-origin: bottom center;
        animation: gamSpawnClone 4s ease-in-out forwards;
        pointer-events: none;
    }

    @keyframes gamSpawnClone {
        0% {
            transform: scale(0.3) translateY(200px) rotate(0deg);
            opacity: 0;
            border-radius: 50% 50% 50% 50%;
        }
        15% {
            opacity: 1;
            transform: scale(1) translateY(0) rotate(5deg);
        }
        35% {
            transform: scale(1.1, 0.9) translateY(-20px) rotate(-10deg);
            border-radius: 30% 70% 40% 60% / 50% 60% 40% 50%;
        }
        65% {
            transform: scale(0.9, 1.1) translateY(-40px) rotate(10deg);
            border-radius: 60% 40% 60% 40% / 60% 40% 60% 40%;
        }
        85% {
            opacity: 0.8;
            transform: scale(0.7) translateY(20px) rotate(-5deg);
        }
        100% {
            transform: scale(0.1) translateY(200px);
            opacity: 0;
            border-radius: 50%;
        }
    }

    .gam-dark-energy-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, rgba(75,0,130,0) 30%, rgba(45,0,70,0.85) 80%, rgba(10,0,15,1) 100%);
        opacity: 0;
        mix-blend-mode: multiply;
        transition: opacity 2s ease-in-out;
        z-index: 2;
        pointer-events: none;
    }

    .gam-dark-energy-overlay.active {
        opacity: 1;
    }

    .gam-domain-title {
        position: absolute;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-size: 2.5rem;
        font-weight: 900;
        letter-spacing: 15px;
        text-shadow: 0 0 10px #000, 0 0 30px #220044;
        opacity: 0;
        z-index: 10;
        transition: opacity 2s ease-in-out;
        pointer-events: none;
    }

    .gam-domain-title.show {
        opacity: 1;
    }

    .left-image img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
    }

    #left-top {
        top: 40px;
        height: 180px;
    }

    #left-middle {
        top: 50%;
        transform: translateY(-50%);
        height: 180px;
    }

    #left-bottom {
        bottom: 40px;
        height: 180px;
    }
</style>

<div id="mainTitle">주술회전 영역전개 따라하기</div>
<button id="startBtn" type="button" onclick="init()">Start</button>

<div id="camera-section">
    <div id="webcam-container"></div>
    <div id="gauge-container">
        <div id="gauge-class-name">준비 중...</div>
        <div id="gauge-bar-container">
            <div id="gauge-bar-fill"></div>
        </div>
    </div>
</div>

<div id="label-container"></div>
<div id="domain-expansion"></div>
<canvas id="domainCanvas"></canvas>
<canvas id="cosmicCanvas"></canvas>
<canvas id="chargeCanvas"></canvas>
<div id="whiteFlash"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script type="text/javascript">
    // More API functions here:
    // https://github.com/googlecreativelab/teachablemachine-community/tree/master/libraries/image

    // the link to your model provided by Teachable Machine export panel
    const URL = "https://teachablemachine.withgoogle.com/models/SEnxXJhbA/";

    let model, webcam, labelContainer, maxPredictions;

    // 게이지바 관련 변수 (Date.now() 경과시간 기반)
    let currentTopClass = null;
    let topClassStartTime = 0;

    // 영역전개 유지(홀드) 관련 변수
    let isDomainActive = false;      // 영역전개 유지 중인지 여부
    let domainActivationTime = 0;    // 영역전개가 발동된 시각
    let lockedClassName = "";        // 유지 중인 영역의 클래스 이름

    // 좌측 이미지 표시/숨김
    function setLeftImagesVisible(visible) {
        document.querySelectorAll('.left-image').forEach((el) => {
            if (visible) {
                el.classList.add('visible');
            } else {
                el.classList.remove('visible');
            }
        });
    }

    // 메인 타이틀 텍스트 전환 (무량공처 발동 중에는 "무량공처"로 표시)
    const DEFAULT_MAIN_TITLE = "주술회전 영역전개 따라하기";
    function setMainTitle(text) {
        const titleEl = document.getElementById('mainTitle');
        if (titleEl) titleEl.textContent = text;
    }
    function resetMainTitle() {
        setMainTitle(DEFAULT_MAIN_TITLE);
    }

    // ===== 무량공처(Void) 전용 배경 효과: 중심에서 뿜어져 나오는 에너지 파편 =====
    const domainCanvas = document.getElementById('domainCanvas');
    const voidCtx = domainCanvas.getContext('2d');
    let voidWidth = domainCanvas.width = window.innerWidth;
    let voidHeight = domainCanvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        voidWidth = domainCanvas.width = window.innerWidth;
        voidHeight = domainCanvas.height = window.innerHeight;
    });

    const voidColors = ['#ff0055', '#aa00ff', '#ff00aa', '#ffffff', '#220033', '#4d004d'];
    const voidLineCount = 200;
    let voidLines = [];
    let voidAnimationId = null;
    let isVoidEffectActive = false;

    class DarkEnergy {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = voidWidth / 2;
            this.y = voidHeight / 2;
            this.angle = Math.random() * Math.PI * 2;
            this.speed = Math.random() * 5 + 2;
            this.color = voidColors[Math.floor(Math.random() * voidColors.length)];
            this.lineWidth = Math.random() * 3 + 0.5;
        }
        update() {
            this.oldX = this.x;
            this.oldY = this.y;
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            this.speed += 0.2;
            if (this.x < 0 || this.x > voidWidth || this.y < 0 || this.y > voidHeight) {
                this.reset();
            }
        }
        draw() {
            voidCtx.beginPath();
            voidCtx.moveTo(this.oldX, this.oldY);
            voidCtx.lineTo(this.x, this.y);
            voidCtx.strokeStyle = this.color;
            voidCtx.lineWidth = this.lineWidth;
            voidCtx.stroke();
        }
    }

    function startVoidEffect() {
        if (isVoidEffectActive) return;
        isVoidEffectActive = true;

        voidLines = [];
        for (let i = 0; i < voidLineCount; i++) {
            const energy = new DarkEnergy();
            energy.x += Math.cos(energy.angle) * (Math.random() * voidWidth / 2);
            energy.y += Math.sin(energy.angle) * (Math.random() * voidHeight / 2);
            voidLines.push(energy);
        }

        voidCtx.fillStyle = '#0b0114';
        voidCtx.fillRect(0, 0, voidWidth, voidHeight);

        domainCanvas.classList.add('active');

        function animateVoid() {
            if (!isVoidEffectActive) return;

            voidCtx.fillStyle = 'rgba(11, 1, 20, 0.12)';
            voidCtx.fillRect(0, 0, voidWidth, voidHeight);

            const centerGrad = voidCtx.createRadialGradient(
                voidWidth / 2, voidHeight / 2, 5,
                voidWidth / 2, voidHeight / 2, voidWidth / 3
            );
            centerGrad.addColorStop(0, 'rgba(0, 0, 0, 1)');
            centerGrad.addColorStop(0.5, 'rgba(30, 0, 50, 0.3)');
            centerGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            voidCtx.fillStyle = centerGrad;
            voidCtx.fillRect(0, 0, voidWidth, voidHeight);

            voidLines.forEach(line => {
                line.update();
                line.draw();
            });

            voidAnimationId = requestAnimationFrame(animateVoid);
        }

        animateVoid();
    }

    function stopVoidEffect() {
        isVoidEffectActive = false;
        if (voidAnimationId) {
            cancelAnimationFrame(voidAnimationId);
            voidAnimationId = null;
        }
        domainCanvas.classList.remove('active');
        voidCtx.clearRect(0, 0, voidWidth, voidHeight);
    }

    // ===== 무량공처 3번째 단계: 우주적 붓터치(블랙홀) 효과 =====
    const cosmicCanvasEl = document.getElementById('cosmicCanvas');
    const cosmicCtx = cosmicCanvasEl.getContext('2d');
    let cosmicWidth = cosmicCanvasEl.width = window.innerWidth;
    let cosmicHeight = cosmicCanvasEl.height = window.innerHeight;

    window.addEventListener('resize', () => {
        cosmicWidth = cosmicCanvasEl.width = window.innerWidth;
        cosmicHeight = cosmicCanvasEl.height = window.innerHeight;
    });

    const cosmicColors = ['#000000', '#000000', '#ffffff', '#ffffff', '#e6e6e6', '#9a9a9a', '#4d4d4d'];
    const cosmicStrokeCount = 150;
    let cosmicStrokes = [];
    let cosmicAnimationId = null;
    let isCosmicEffectActive = false;

    class CosmicStroke {
        constructor() {
            this.reset();
        }
        reset() {
            this.centerX = cosmicWidth / 2;
            this.centerY = cosmicHeight / 2;
            this.radius = Math.random() * 50;
            this.angle = Math.random() * Math.PI * 2;
            this.speed = Math.random() * 2 + 1;
            this.rotSpeed = (Math.random() * 0.02 + 0.005) * (Math.random() > 0.5 ? 1 : -1);
            this.color = cosmicColors[Math.floor(Math.random() * cosmicColors.length)];
            this.lineWidth = Math.random() * 6 + 2;
            this.life = Math.random() * 300 + 100;
            this.opacity = 0;
        }
        update() {
            this.oldX = this.centerX + Math.cos(this.angle) * this.radius;
            this.oldY = this.centerY + Math.sin(this.angle) * this.radius;

            this.angle += this.rotSpeed;
            this.radius += this.speed;
            this.speed += 0.1;

            if (this.life > 300) {
                this.opacity += 0.05;
            } else {
                this.opacity = this.life / 300;
            }
            this.life--;

            if (this.life <= 0 || this.radius > Math.max(cosmicWidth, cosmicHeight)) {
                this.reset();
            }
        }
        draw() {
            if (this.opacity <= 0) return;

            const currentX = this.centerX + Math.cos(this.angle) * this.radius;
            const currentY = this.centerY + Math.sin(this.angle) * this.radius;

            cosmicCtx.beginPath();
            cosmicCtx.moveTo(this.oldX, this.oldY);
            cosmicCtx.lineTo(currentX, currentY);

            const alpha = Math.min(1, Math.max(0, this.opacity));
            cosmicCtx.strokeStyle = this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
            cosmicCtx.lineWidth = this.lineWidth;
            cosmicCtx.lineCap = 'round';

            if (this.color === '#ffffff' || this.color === '#e6e6e6') {
                cosmicCtx.shadowColor = '#ffffff';
                cosmicCtx.shadowBlur = 12;
            }

            cosmicCtx.stroke();

            cosmicCtx.shadowColor = 'transparent';
            cosmicCtx.shadowBlur = 0;
        }
    }

    function startCosmicEffect() {
        if (isCosmicEffectActive) return;
        isCosmicEffectActive = true;

        cosmicStrokes = [];
        for (let i = 0; i < cosmicStrokeCount; i++) {
            const stroke = new CosmicStroke();
            stroke.radius = Math.random() * Math.max(cosmicWidth, cosmicHeight) * 0.7;
            stroke.life = Math.random() * 300;
            cosmicStrokes.push(stroke);
        }

        cosmicCtx.fillStyle = '#000000';
        cosmicCtx.fillRect(0, 0, cosmicWidth, cosmicHeight);

        cosmicCanvasEl.classList.add('active');

        function animateCosmic() {
            if (!isCosmicEffectActive) return;

            cosmicCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            cosmicCtx.fillRect(0, 0, cosmicWidth, cosmicHeight);

            const blackHole = cosmicCtx.createRadialGradient(
                cosmicWidth / 2, cosmicHeight / 2, 0,
                cosmicWidth / 2, cosmicHeight / 2, cosmicWidth / 3.2
            );
            blackHole.addColorStop(0, 'rgba(0, 0, 0, 1)');          // 완전한 블랙홀 중심
            blackHole.addColorStop(0.28, 'rgba(0, 0, 0, 1)');       // 순수 검정 구간을 넓게 유지
            blackHole.addColorStop(0.36, 'rgba(255, 255, 255, 0.95)'); // 사건의 지평선 - 강렬한 화이트 링
            blackHole.addColorStop(0.44, 'rgba(255, 255, 255, 0.15)');  // 링 바깥으로 은은하게 번지는 흰빛
            blackHole.addColorStop(0.7, 'rgba(255, 255, 255, 0.03)');
            blackHole.addColorStop(1, 'rgba(0,0,0,0)');

            cosmicCtx.fillStyle = blackHole;
            cosmicCtx.fillRect(0, 0, cosmicWidth, cosmicHeight);

            cosmicStrokes.forEach(stroke => {
                stroke.update();
                stroke.draw();
            });

            cosmicAnimationId = requestAnimationFrame(animateCosmic);
        }

        animateCosmic();
    }

    function stopCosmicEffect() {
        isCosmicEffectActive = false;
        if (cosmicAnimationId) {
            cancelAnimationFrame(cosmicAnimationId);
            cosmicAnimationId = null;
        }
        cosmicCanvasEl.classList.remove('active');
        cosmicCtx.clearRect(0, 0, cosmicWidth, cosmicHeight);
    }

    // ===== 무량공처 1번째 단계: 화이트아웃 플래시 =====
    function showWhiteFlash() {
        document.getElementById('whiteFlash').classList.add('active');
    }
    function hideWhiteFlash() {
        document.getElementById('whiteFlash').classList.remove('active');
    }

    // 무량공처 연출 단계 관리 (-1: 없음, 0: 화이트아웃 1초, 1: 에너지파편 4초, 2: 우주 붓터치 5초)
    let muryoPhase = -1;

    function stopAllMuryoEffects() {
        hideWhiteFlash();
        stopVoidEffect();
        stopCosmicEffect();
        muryoPhase = -1;
    }

    // ===== 영역전개 충전 단계: 주력이 화면 중앙(카메라)으로 모여드는 이펙트 =====
    const chargeCanvasEl = document.getElementById('chargeCanvas');
    const chargeCtx = chargeCanvasEl.getContext('2d');
    let chargeWidth = chargeCanvasEl.width = window.innerWidth;
    let chargeHeight = chargeCanvasEl.height = window.innerHeight;

    window.addEventListener('resize', () => {
        chargeWidth = chargeCanvasEl.width = window.innerWidth;
        chargeHeight = chargeCanvasEl.height = window.innerHeight;
    });

    class ChargeParticle {
        constructor() {
            this.reset();
        }
        reset() {
            // 화면 중심(카메라)을 향해 사방에서 모여들도록 원형으로 배치
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.min(chargeWidth, chargeHeight) * (0.4 + Math.random() * 0.5);
            this.angle = angle;
            this.dist = dist;
            this.baseSpeed = Math.random() * 1.2 + 0.5;
            this.size = Math.random() * 2 + 1;
        }
        update(intensity) {
            // 충전 강도(intensity: 0~1)가 높을수록 더 빠르게 중심으로 빨려 들어감
            const speed = this.baseSpeed * (1 + intensity * 8);
            this.dist -= speed;
            if (this.dist < 15) {
                this.reset();
            }
        }
        draw(intensity) {
            const cx = chargeWidth / 2;
            const cy = chargeHeight / 2;
            const x = cx + Math.cos(this.angle) * this.dist;
            const y = cy + Math.sin(this.angle) * this.dist;

            const alpha = Math.min(1, 0.25 + intensity * 0.75);
            chargeCtx.beginPath();
            chargeCtx.arc(x, y, this.size * (1 + intensity * 1.5), 0, Math.PI * 2);
            chargeCtx.fillStyle = `rgba(60, 170, 255, ${alpha})`;
            chargeCtx.shadowColor = '#3ca9ff';
            chargeCtx.shadowBlur = 4 + intensity * 14;
            chargeCtx.fill();
            chargeCtx.shadowColor = 'transparent';
            chargeCtx.shadowBlur = 0;
        }
    }

    const chargeParticlePool = [];
    for (let i = 0; i < 120; i++) {
        chargeParticlePool.push(new ChargeParticle());
    }

    // 충전 진행률(0~100)에 맞춰 이펙트를 점점 강하게 그림
    function updateChargeEffect(progressPercent) {
        const intensity = Math.min(progressPercent / 100, 1);

        chargeCanvasEl.classList.add('active');

        // 파티클이 선(트레일)이 아닌 점으로 그려지므로, 매 프레임 완전히 지워서
        // 반투명 덧칠 방식에서 발생하던 누적(화면이 파랗게 물드는) 현상을 방지합니다
        chargeCtx.clearRect(0, 0, chargeWidth, chargeHeight);

        // 강도가 높아질수록 활성화되는 입자 수도 늘어남
        const activeCount = Math.floor(25 + intensity * (chargeParticlePool.length - 25));
        for (let i = 0; i < activeCount; i++) {
            chargeParticlePool[i].update(intensity);
            chargeParticlePool[i].draw(intensity);
        }

        // 카메라 위치(중앙)에 강도에 따라 커지고 밝아지는 코어 광원
        const cx = chargeWidth / 2;
        const cy = chargeHeight / 2;
        const glowRadius = 30 + intensity * 160;
        const coreGlow = chargeCtx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius);
        coreGlow.addColorStop(0, `rgba(120, 200, 255, ${0.55 * intensity})`);
        coreGlow.addColorStop(0.6, `rgba(0, 110, 220, ${0.25 * intensity})`);
        coreGlow.addColorStop(1, 'rgba(0, 110, 220, 0)');
        chargeCtx.fillStyle = coreGlow;
        chargeCtx.beginPath();
        chargeCtx.arc(cx, cy, glowRadius, 0, Math.PI * 2);
        chargeCtx.fill();
    }

    // 충전 이펙트 초기화 (영역전개 발동 시 / 비주술사 감지 시 호출)
    function clearChargeEffect() {
        chargeCanvasEl.classList.remove('active');
        chargeCtx.clearRect(0, 0, chargeWidth, chargeHeight);
    }

    // ===== 복마어주자 전용 화면 전환: 붉은 주력 폭발 -> 청록 격자벽/피바다 영역 =====
    let bokmaShakeTimeout = null;
    let bokmaWorldTimeout = null;
    let bokmaTitleTimeout = null;
    let bokmaClosingTimeout = null;

    function startBokmaEffect() {
        const container = document.getElementById('bokmaContainer');
        const wave = document.getElementById('bokmaEnergyWave');
        const world = document.getElementById('bokmaWorld');
        const title = document.getElementById('bokmaTitle');

        // 이전에 남아있던 타이머 정리 (연속 발동 대비)
        clearTimeout(bokmaShakeTimeout);
        clearTimeout(bokmaWorldTimeout);
        clearTimeout(bokmaTitleTimeout);
        clearTimeout(bokmaClosingTimeout);

        container.classList.remove('bokma-closing');
        container.classList.add('bokma-visible');

        // 주력 폭발 애니메이션을 처음부터 재생 (리플로우로 강제 리스타트)
        wave.classList.remove('bokma-expand-energy');
        void wave.offsetWidth;
        wave.classList.add('bokma-expand-energy');

        // 화면 흔들림 애니메이션도 처음부터 재생
        container.classList.remove('bokma-shake');
        void container.offsetWidth;
        container.classList.add('bokma-shake');

        // 주력이 최대로 차올랐을 때 영역 내부 등장 (0.8초 뒤)
        bokmaWorldTimeout = setTimeout(() => {
            world.classList.add('active');
        }, 800);

        // 타이틀 텍스트 등장 (1.5초 뒤)
        bokmaTitleTimeout = setTimeout(() => {
            title.classList.add('show');
        }, 1500);

        // 흔들림 클래스 제거 (애니메이션 완료 후 정리)
        bokmaShakeTimeout = setTimeout(() => {
            container.classList.remove('bokma-shake');
        }, 1000);
    }

    function stopBokmaEffect() {
        clearTimeout(bokmaShakeTimeout);
        clearTimeout(bokmaWorldTimeout);
        clearTimeout(bokmaTitleTimeout);
        clearTimeout(bokmaClosingTimeout);

        const container = document.getElementById('bokmaContainer');
        const wave = document.getElementById('bokmaEnergyWave');
        const world = document.getElementById('bokmaWorld');
        const title = document.getElementById('bokmaTitle');

        // 내부 요소들을 먼저 즉시 원래 상태로 리셋 (겹쳐 보이지 않도록)
        container.classList.remove('bokma-visible');
        container.classList.add('bokma-closing');
        container.classList.remove('bokma-shake');
        wave.classList.remove('bokma-expand-energy');
        world.classList.remove('active');
        title.classList.remove('show');

        // 페이드아웃(0.2s)이 끝나면 closing 클래스도 제거해 다음 발동을 위해 완전히 초기화
        bokmaClosingTimeout = setTimeout(() => {
            container.classList.remove('bokma-closing');
        }, 250);
    }

    // ===== 감함압예정 전용 화면 전환: 검은 주력 오버레이 -> 그림자 늪 -> 그림자 분신들 =====
    let gamWrapperTimeout = null;
    let gamTitleTimeout = null;
    let gamClosingTimeout = null;
    let gamCloneInterval = null;

    function startGamhamEffect() {
        const container = document.getElementById('gamContainer');
        const overlay = document.getElementById('gamDarkOverlay');
        const wrapper = document.getElementById('gamGardenWrapper');
        const title = document.getElementById('gamTitle');

        // 이전에 남아있던 타이머 정리 (연속 발동 대비)
        clearTimeout(gamWrapperTimeout);
        clearTimeout(gamTitleTimeout);
        clearTimeout(gamClosingTimeout);
        clearInterval(gamCloneInterval);

        container.classList.remove('gam-closing');
        container.classList.add('gam-visible');

        // 검은 주력이 서서히 화면을 덮음
        overlay.classList.add('active');

        // 0.8초 뒤, 그림자 늪이 아래서부터 차오르기 시작
        gamWrapperTimeout = setTimeout(() => {
            wrapper.classList.add('active');
        }, 800);

        // 1.5초 뒤, 영역 이름 타이틀 표시 및 그림자 분신 생성 시작
        gamTitleTimeout = setTimeout(() => {
            title.classList.add('show');
            gamCloneInterval = setInterval(createGamShadowClone, 400);
        }, 1500);
    }

    // 그림자 분신 하나를 생성
    function createGamShadowClone() {
        const container = document.getElementById('gamCloneContainer');
        if (!container) return;

        const clone = document.createElement('div');
        clone.classList.add('gam-shadow-clone');

        const sizeWidth = Math.floor(Math.random() * 80) + 60; // 60px ~ 140px
        const sizeHeight = sizeWidth * (Math.random() * 0.8 + 1.5);
        const posX = Math.floor(Math.random() * 90); // 0% ~ 90%
        const animDuration = (Math.random() * 1.5 + 3).toFixed(1); // 3s ~ 4.5s

        clone.style.width = `${sizeWidth}px`;
        clone.style.height = `${sizeHeight}px`;
        clone.style.left = `${posX}%`;
        clone.style.animationDuration = `${animDuration}s`;

        // 흐느적거리는 느낌을 위한 무작위 왜곡
        const r1 = Math.floor(Math.random() * 30) + 30;
        const r2 = 100 - r1;
        const r3 = Math.floor(Math.random() * 30) + 30;
        const r4 = 100 - r3;
        clone.style.borderRadius = `${r1}% ${r2}% ${r3}% ${r4}% / ${r4}% ${r3}% ${r2}% ${r1}%`;

        container.appendChild(clone);

        // 애니메이션이 끝나면 DOM에서 제거
        setTimeout(() => {
            clone.remove();
        }, animDuration * 1000);
    }

    function stopGamhamEffect() {
        clearTimeout(gamWrapperTimeout);
        clearTimeout(gamTitleTimeout);
        clearTimeout(gamClosingTimeout);
        clearInterval(gamCloneInterval);

        const container = document.getElementById('gamContainer');
        const overlay = document.getElementById('gamDarkOverlay');
        const wrapper = document.getElementById('gamGardenWrapper');
        const title = document.getElementById('gamTitle');
        const cloneContainer = document.getElementById('gamCloneContainer');

        container.classList.remove('gam-visible');
        container.classList.add('gam-closing');
        overlay.classList.remove('active');
        wrapper.classList.remove('active');
        title.classList.remove('show');

        // 남아있는 그림자 분신들 즉시 제거
        if (cloneContainer) {
            cloneContainer.innerHTML = '';
        }

        gamClosingTimeout = setTimeout(() => {
            container.classList.remove('gam-closing');
        }, 250);
    }

    // 좌측 이미지 클릭 시 강제로 해당 영역을 전개 (영역전개 상태가 아닐 때만 동작)
    function forceTriggerDomain(className) {
        if (isDomainActive) return; // 이미 다른 영역이 전개/유지 중이면 무시

        isDomainActive = true;
        domainActivationTime = Date.now();
        lockedClassName = className;
        currentTopClass = className;

        // 게이지바를 즉시 유지(홀드) 상태로 표시
        const gaugeFill = document.getElementById("gauge-bar-fill");
        const gaugeLabel = document.getElementById("gauge-class-name");
        gaugeFill.style.width = "100%";
        gaugeLabel.textContent = "영역 유지 중... 10s";

        triggerDomainExpansion();
        setLeftImagesVisible(false);
        clearChargeEffect();
        // 무량공처의 경우 다음 predict() 프레임에서 자동으로 1단계(화이트아웃)부터 시작됩니다

        if (className.includes("복마어주자")) {
            startBokmaEffect();
        }
        if (className.includes("감함압예정")) {
            startGamhamEffect();
        }
        if (className.includes("무량공처")) {
            setMainTitle("무량공처");
        }
    }

    // Load the image model and setup the webcam
    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        // Start 버튼만 숨김
        document.getElementById("startBtn").classList.add("hidden");
        
        // 카메라 섹션, 라벨 컨테이너, 게이지 컨테이너, 좌측 이미지 표시
        document.getElementById("camera-section").classList.add("visible");
        document.getElementById("label-container").classList.add("visible");
        document.getElementById("gauge-container").classList.add("visible");
        setLeftImagesVisible(true);

        // load the model and metadata
        // Refer to tmImage.loadFromFiles() in the API to support files from a file picker
        // or files from your local hard drive
        // Note: the pose library adds "tmImage" object to your window (window.tmImage)
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // Convenience function to setup a webcam
        const flip = true; // whether to flip the webcam
        webcam = new tmImage.Webcam(300, 300, flip); // width, height, flip
        await webcam.setup(); // request access to the webcam
        await webcam.play();
        window.requestAnimationFrame(loop);

        // append elements to the DOM
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        labelContainer = document.getElementById("label-container");
        for (let i = 0; i < maxPredictions; i++) { // and class labels
            labelContainer.appendChild(document.createElement("div"));
        }
    }

    async function loop() {
        webcam.update(); // update the webcam frame
        await predict();
        window.requestAnimationFrame(loop);
    }

    // run the webcam image through the image model
    async function predict() {
        // predict can take in an image, video or canvas html element
        const prediction = await model.predict(webcam.canvas);

        const gaugeFill = document.getElementById("gauge-bar-fill");
        const gaugeLabel = document.getElementById("gauge-class-name");

        // 최고 확률 클래스 찾기
        let highestIndex = 0;
        let highestProbability = -1;
        for (let i = 0; i < maxPredictions; i++) {
            if (prediction[i].probability > highestProbability) {
                highestProbability = prediction[i].probability;
                highestIndex = i;
            }
        }
        const highestClass = prediction[highestIndex].className;

        if (isDomainActive) {
            // ===== 영역전개 유지(홀드) 단계: 같은 게이지바로 10초 카운트다운 =====
            const holdElapsed = Date.now() - domainActivationTime;

            if (holdElapsed >= 10000) {
                // 10초 유지 종료 -> 초기화하고 다시 대기 상태로
                isDomainActive = false;
                currentTopClass = null;
                lockedClassName = "";
                gaugeFill.style.width = "0%";
                gaugeLabel.textContent = "영역전개 중";
                setLeftImagesVisible(true);
                stopAllMuryoEffects(); // 무량공처 전용 3단계 연출 모두 정리 (활성화 안 됐으면 안전하게 무시됨)
                stopBokmaEffect(); // 복마어주자 전용 화면전환 정리 (활성화 안 됐으면 안전하게 무시됨)
                stopGamhamEffect(); // 감함압예정 전용 화면전환 정리 (활성화 안 됐으면 안전하게 무시됨)
                resetMainTitle(); // 메인 타이틀을 원래 문구로 복원
            } else {
                const remainingSeconds = Math.ceil((10000 - holdElapsed) / 1000);
                const remainPercent = ((10000 - holdElapsed) / 10000) * 100;
                gaugeFill.style.width = remainPercent + "%";
                gaugeLabel.textContent = `영역 유지 중... ${remainingSeconds}s`;

                // 무량공처 전용 3단계 연출: 1초 화이트아웃 -> 4초 에너지파편 -> 5초 우주 붓터치
                if (lockedClassName.includes("무량공처")) {
                    let targetPhase;
                    if (holdElapsed < 1000) {
                        targetPhase = 0; // 화이트아웃
                    } else if (holdElapsed < 5000) {
                        targetPhase = 1; // 에너지 파편 (4초)
                    } else {
                        targetPhase = 2; // 우주 붓터치 (5초)
                    }

                    if (targetPhase !== muryoPhase) {
                        // 이전 단계 정리
                        if (muryoPhase === 0) hideWhiteFlash();
                        if (muryoPhase === 1) stopVoidEffect();
                        if (muryoPhase === 2) stopCosmicEffect();

                        // 새 단계 시작
                        if (targetPhase === 0) showWhiteFlash();
                        if (targetPhase === 1) startVoidEffect();
                        if (targetPhase === 2) startCosmicEffect();

                        muryoPhase = targetPhase;
                    }
                }
            }
        } else {
            // ===== 게이지 충전 단계 =====

            // 비주술사는 쓰레기값을 모아놓은 클래스이므로 영역전개 발동 대상에서 제외
            if (highestClass.includes("비주술사")) {
                currentTopClass = null; // 다음에 실제 클래스가 잡히면 타이머를 새로 시작하도록 초기화
                gaugeFill.style.width = "0%";
                gaugeLabel.textContent = "영역전개 중";
                clearChargeEffect();
            } else {
                // 최고 확률 클래스가 바뀌면 타이머 리셋
                if (currentTopClass !== highestClass) {
                    currentTopClass = highestClass;
                    topClassStartTime = Date.now();
                }

                // 경과시간 기반 진행률 계산 (프레임마다 새로 계산하므로 오차 누적 없음)
                const elapsed = Date.now() - topClassStartTime;
                const progressPercent = Math.min((elapsed / 5000) * 100, 100);

                gaugeFill.style.width = progressPercent + "%";
                gaugeLabel.textContent = "영역전개 중";

                // 진행률이 오를수록 점점 강해지는 주력 응집 이펙트
                updateChargeEffect(progressPercent);

                // 5초 동안 같은 클래스가 유지되면 영역전개 발동
                if (progressPercent >= 100) {
                    isDomainActive = true;
                    domainActivationTime = Date.now();
                    lockedClassName = highestClass;

                    clearChargeEffect();
                    triggerDomainExpansion();
                    setLeftImagesVisible(false);
                    // 무량공처의 경우 다음 predict() 프레임에서 자동으로 1단계(화이트아웃)부터 시작됩니다

                    if (highestClass.includes("복마어주자")) {
                        startBokmaEffect();
                    }
                    if (highestClass.includes("감함압예정")) {
                        startGamhamEffect();
                    }
                    if (highestClass.includes("무량공처")) {
                        setMainTitle("무량공처");
                    }
                }
            }
        }

        // 우측 라벨 컨테이너에 모든 클래스 정보 표시 + 강조 클래스 표시
        // (유지 중일 때는 발동시킨 클래스를, 충전 중일 때는 현재 최고 확률 클래스를 강조)
        const highlightClass = isDomainActive ? lockedClassName : highestClass;
        for (let i = 0; i < maxPredictions; i++) {
            const classPrediction =
                prediction[i].className + ": " + prediction[i].probability.toFixed(2);
            labelContainer.childNodes[i].innerHTML = classPrediction;

            if (prediction[i].className === highlightClass) {
                labelContainer.childNodes[i].classList.add("selected-class");
            } else {
                labelContainer.childNodes[i].classList.remove("selected-class");
            }
        }
    }

    // 영역전개 애니메이션
    function triggerDomainExpansion() {
        const domainExpansion = document.getElementById("domain-expansion");
        domainExpansion.classList.remove("active");
        
        // 리플로우를 강제해서 애니메이션을 다시 시작
        void domainExpansion.offsetWidth;
        
        domainExpansion.classList.add("active");
    }
</script>
